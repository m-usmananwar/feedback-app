name: Feedback Master Deployment

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'

    - name: Install dependencies
      run: composer install --no-dev

    - name: Set up AWS CLI
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

    - name: Create PEM file
      run: |
        echo "${{ secrets.AWS_PEM_FILE }}" > laravel-dude-updated.pem
        chmod 400 laravel-dude-updated.pem

    - name: Deploy to AWS EC2
      run: |
        ssh -o StrictHostKeyChecking=no -i laravel-dude-updated.pem ubuntu@${{ secrets.AWS_INSTANCE_IP }} "
        cd /var/www/html/feedback-app &&
        sudo git pull https://${{ secrets.PERSONAL_ACCESS_TOKEN }}:x-oauth-basic@github.com/OWNER/REPOSITORY.git &&
        sudo php artisan down &&
        sudo composer install --no-dev &&
        sudo php artisan migrate --force &&
        sudo php artisan optimize:clear &&
        sudo php artisan up
        "
